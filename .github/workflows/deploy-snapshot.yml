name: Deploy SNAPSHOT

on:
  push:
    branches:
      - develop

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      # Checkout source code
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Setup Java environment
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: zulu
          cache: maven

      # Run maven verify (includes unit tests)
      - name: Maven verify
        run: mvn verify --batch-mode

      # Step to save the coverage report for the Analyze job
      - name: Upload JaCoCo Report
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: core/target/site/jacoco/jacoco.xml
          retention-days: 1

  analyze:
    name: Analyze
    needs: verify
    runs-on: ubuntu-latest
    steps:
      # Checkout source code
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Setup Java environment
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: zulu
          cache: maven

      # Step to retrieve the report from the Verify job
      - name: Download JaCoCo Report
        uses: actions/download-artifact@v8
        with:
          name: jacoco-report
          path: core/target/site/jacoco/

      # Cache SonarQube packages
      - name: Cache SonarQube packages
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # Cache Maven packages
      - name: Cache Maven packages
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # Run maven verify and sonar scan
      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=merkle-open_aem-environment-badge -DskipTests

  deploy-snapshot:
    name: Deploy SNAPSHOT
    needs: [ verify, analyze ]
    runs-on: ubuntu-latest
    steps:
      # Checkout source code
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Setup Java environment
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          cache: maven

      # Pin Maven version
      - name: Set up Maven 3.9.16
        uses: s4u/setup-maven-action@4a02cbd99769e46198135c31d5097c94618ba3f5 # v1.21.0
        with:
          maven-version: 3.9.16

      # Print Maven version
      - name: Print Maven version
        run: mvn -version

      # Run maven deploy (to Sonatype)
      - name: Release Maven package
        # Added -DskipTests as verification happened in the first job
        run: mvn deploy -Pdeploy -DskipTests --batch-mode
        env:
          MAVEN_USERNAME: ${{ secrets.SONATYPE_USER }}
          MAVEN_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      # Upload artifacts uploaded to Maven Central to GitHub Actions
      - name: Upload Snapshot Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: central-staging-artifacts
          path: |
            target/central-staging/
            target/central-publishing/
            **/target/*.jar
            **/target/*.zip
            **/target/*.pom
            **/target/*.asc
          if-no-files-found: ignore
